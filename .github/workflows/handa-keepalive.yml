# Pings the Supabase project once a day so the free tier does not pause it
# after a week of inactivity. Calls the `ping()` RPC from supabase/schema.sql
# with the anon key (the only thing anon may execute).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  the anon/public key
# The job is skipped (green, with a notice) when the secrets are not set.
#
# NOTE: GitHub only runs workflows from `.github/workflows` at the REPOSITORY
# ROOT. If `handa/` lives inside a larger repo, copy this file there.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC (11:17 PHT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      # `secrets` is not allowed in a job-level `if`, so gate on a step output.
      - name: Check secrets
        id: check
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY not set; skipping keep-alive."
          fi

      - name: Call ping()
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          url="${SUPABASE_URL%/}/rest/v1/rpc/ping"
          for i in 1 2 3; do
            if out=$(curl -fsS --max-time 30 -X POST "$url" \
                 -H "apikey: $SUPABASE_ANON_KEY" \
                 -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                 -H "Content-Type: application/json" \
                 -d '{}'); then
              echo "pinged at $out"
              exit 0
            fi
            echo "attempt $i failed; retrying..."
            sleep $((i * 10))
          done
          echo "::error::ping() failed after 3 attempts"
          exit 1
